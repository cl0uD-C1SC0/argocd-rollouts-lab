---
- name: Instalar Kind CLI no Linux
  hosts: linux
  become: true
  gather_facts: true

  vars:
    kind_version: "v0.29.0"
    download_path: "/tmp/kind"

  tasks:

    - name: Baixar Kind CLI
      ansible.builtin.get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: "{{ download_path }}"
        mode: "0755"

    - name: Instalar Kind CLI
      ansible.builtin.copy:
        src: "{{ download_path }}"
        dest: "/usr/local/bin/kind"
        mode: "0755"
        remote_src: true

    - name: Validar instalação
      ansible.builtin.command:
        cmd: kind version
      register: kind_result
      changed_when: false

    - name: Mostrar versão instalada
      ansible.builtin.debug:
        msg: "{{ kind_result.stdout }}"