---
- name: Instalar Docker Engine no Linux
  hosts: linux
  become: true
  gather_facts: true

  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:

    - name: Remover PPA antigo do Ansible (se existir)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/ansible-ubuntu-ansible-resolute.list
        state: absent
      ignore_errors: true

    - name: Instalar dependências
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        update_cache: true
        state: present

    - name: Criar diretório keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar chave GPG Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Adicionar repositório Docker
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present

    - name: Atualizar cache APT
      ansible.builtin.apt:
        update_cache: true

    - name: Instalar Docker
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Habilitar Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Adicionar usuário atual ao grupo docker
      ansible.builtin.user:
        name: "{{ ansible_env.USER }}"
        groups: docker
        append: true

    - name: Validar instalação
      ansible.builtin.command:
        cmd: docker version
      register: docker_result
      changed_when: false

    - name: Mostrar versão
      ansible.builtin.debug:
        msg: "{{ docker_result.stdout }}"